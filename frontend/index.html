<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Resolve the theme before first paint so dark mode never flashes light. Mirrors src/hooks/useTheme.ts.
      (function () {
        var pref = null;
        try { pref = localStorage.getItem('shiftboard-theme'); } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%231A1D23'/%3E%3Crect x='3' y='3.5' width='2.5' height='9' rx='1.25' fill='white' fill-opacity='.45'/%3E%3Crect x='6.75' y='3.5' width='2.5' height='9' rx='1.25' fill='%239583FF'/%3E%3Crect x='10.5' y='3.5' width='2.5' height='9' rx='1.25' fill='white' fill-opacity='.45'/%3E%3C/svg%3E" />
    <title>Shiftboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
